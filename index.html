<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Portal 360º VR | Portal do Educador</title>
<meta name="description" content="Portal 360º VR: experiências educacionais imersivas em 3D e realidade virtual para a lousa, o computador e os óculos VR. Uma experiência Portal do Educador.">
<meta name="theme-color" content="#050b18">
<link rel="icon" type="image/svg+xml" href="assets/marca/p360-favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/marca/p360-favicon-32.png">
<link rel="apple-touch-icon" href="assets/marca/p360-icone-180.png">
<style>
/* Protótipo da nova tela inicial do Portal 360º (Fase 1). Identidade NEWPC: azul #0f2c4a, verde #1a6b2a. */
:root{--azul:#0f2c4a;--verde:#1a6b2a;--verde2:#2fd16b;--fundo:#050d18;--texto:#f2f7fb;--suave:#a9bfd0;--r:22px;--tile:300px}
*{box-sizing:border-box}html,body{margin:0;background:var(--fundo);color:var(--texto);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
html{touch-action:pan-x pan-y}
button{font:inherit;cursor:pointer}a{color:inherit}
body.quest{font-size:118%}
.barra{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px clamp(14px,3vw,36px);background:linear-gradient(180deg,rgba(5,13,24,.96),rgba(5,13,24,.8));backdrop-filter:blur(10px);border-bottom:1px solid #16314b}
.barra img{height:42px}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;border:2px solid #2b5679;background:#0c2136;color:var(--texto);padding:10px 16px;font-weight:700;min-height:48px}
.chip:hover,.chip:focus-visible{border-color:var(--verde2);outline:none}
.chip[hidden]{display:none}.chip.som[aria-pressed="true"]{background:#14472a;border-color:var(--verde2)}
.direita{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
/* ---------- vitrine: todos os apps de cara ---------- */
.vitrine{max-width:1500px;margin:0 auto;padding:clamp(18px,3vw,40px) clamp(14px,3vw,40px) 70px}
.topo-v{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.topo-v h1{font-size:clamp(28px,3.6vw,48px);margin:0;line-height:1.05}
.topo-v h1 span{background:linear-gradient(90deg,#7dffb0,#7cc7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.topo-v p{margin:6px 0 0;color:var(--suave);font-size:clamp(15px,1.4vw,18px)}
.filtros{display:flex;gap:8px;flex-wrap:wrap}
.filtro{border-radius:999px;border:1.5px solid #284d6c;background:#0b1d30;color:#cfe0ec;padding:9px 16px;font-weight:700;font-size:15px;min-height:44px}
.filtro[aria-pressed="true"]{background:var(--verde);border-color:var(--verde2);color:#fff}
.filtro:hover,.filtro:focus-visible{border-color:var(--verde2);outline:none}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:clamp(14px,1.6vw,24px)}
.quest .grade{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
.cel{position:relative;animation:entra .4s ease both}
.card{position:relative;display:flex;height:100%;text-decoration:none;flex-direction:column;border:1px solid #1d3a55;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#0d2238,#091827);color:#fff;text-align:left;padding:0;outline:none;box-shadow:0 14px 34px rgba(0,0,0,.38);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card .foto{position:relative;aspect-ratio:16/10;overflow:hidden}
.card .foto i{position:absolute;inset:0;background:#0c2136 center/cover no-repeat;transition:transform .5s ease}
.card .foto::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(9,24,39,.95) 100%)}
.card:hover,.card:focus-visible{transform:translateY(-6px);border-color:var(--verde2);box-shadow:0 0 0 3px rgba(47,209,107,.55),0 24px 50px rgba(0,0,0,.5)}
.card:hover .foto i,.card:focus-visible .foto i{transform:scale(1.07)}
.card .corpo{padding:4px 18px 18px;margin-top:-26px;position:relative;z-index:2;display:flex;flex-direction:column;gap:6px;flex:1}
.card b{font-size:clamp(20px,1.6vw,24px);line-height:1.1}
.card .d{color:#b9cfe0;font-size:15px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.quest .card b{font-size:28px}.quest .card .d{font-size:17px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.tag{font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:#13304a;color:#bcd6ea}
.tag.vr{background:#11391f;color:#bff5d3;border:1px solid #2fd16b}
.selo{position:absolute;left:12px;top:12px;z-index:3;font-weight:800;font-size:12.5px;letter-spacing:.04em;border-radius:999px;padding:5px 11px;background:#1a6b2a;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.selo.cont{background:#0f2c4a;border:1px solid #4b7fa8}
.cta{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;margin-top:8px;border-radius:12px;padding:9px 14px;font-weight:800;font-size:15px;background:#123552;color:#fff;border:1.5px solid #2f6a96}
.card.trava{cursor:default}
.card.trava .foto i,.card.trava .foto img.capa{filter:grayscale(.2) brightness(.82)}
.card.trava:hover{transform:none;border-color:#2b4d6b;box-shadow:0 14px 34px rgba(0,0,0,.38)}
.card .foto .prov{position:absolute;inset:0;display:grid;place-items:center}
.card .foto .prov em{font-style:normal;font-size:clamp(64px,6vw,96px);filter:drop-shadow(0 8px 18px rgba(0,0,0,.5));opacity:.9}
.card .foto img.capa{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.selo.breve{background:rgba(5,13,24,.9);border:1.5px solid #f2c14e;color:#ffe3a8}
.cta.off{background:#1b2a38;border-color:#3b4f62;color:#9fb3c4}
.cta.vr{background:linear-gradient(160deg,#1a6b2a,#0f4a1f);border-color:#2fd16b}
.card:hover .cta,.card:focus-visible .cta{border-color:#7dffb0}
.quest .cta{font-size:19px;padding:12px 18px}
.mini{position:absolute;right:12px;top:12px;z-index:4;border-radius:999px;border:1.5px solid #4b7fa8;background:rgba(5,13,24,.85);color:#fff;font-weight:800;font-size:13px;padding:7px 12px;min-height:38px}
.mini:hover,.mini:focus-visible{background:var(--verde);border-color:var(--verde2);outline:none}
.modo{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:14px;color:#cfe0ec;background:#0c2136;border:1px solid #284d6c;border-radius:999px;padding:6px 12px}
.modo a{color:#7dffb0;font-weight:700}
.fechar{position:absolute;right:22px;top:18px;z-index:3;width:64px;height:64px;border-radius:50%;border:2px solid #4b7fa8;background:rgba(5,13,24,.85);color:#fff;font-size:30px}
.fechar:hover,.fechar:focus-visible{border-color:var(--verde2);outline:none}
.video{position:fixed;inset:0;z-index:60;display:none;background:rgba(0,0,0,.92);place-items:center;padding:20px}.video.aberto{display:grid}
.video iframe{width:min(1100px,100%);aspect-ratio:16/9;border:0;border-radius:16px;background:#000}
.dica-quest{margin:0 0 16px;padding:14px 18px;border-radius:16px;background:#0c2a1a;border:1px solid #2c7a4a;color:#d7f5e2;font-size:16px;display:none}
.quest .dica-quest{display:block}
@media(max-width:900px){}
@media(max-width:600px){.grade{grid-template-columns:1fr 1fr;gap:12px}.card .corpo{padding:2px 12px 12px}.card b{font-size:17px}.card .d{display:none}.filtros{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px;width:calc(100% + 28px)}.filtros::-webkit-scrollbar{display:none}.filtro{flex:0 0 auto}.tag{font-size:11px;padding:3px 8px}}
@media(max-width:600px){.barra img{height:30px}.barra{gap:8px;padding:10px 12px}.direita{gap:6px;flex-wrap:nowrap}.chip{padding:8px 10px;min-height:44px}.chip .rot{display:none}.barra img{height:24px}.chip{padding:6px 8px;min-height:40px;gap:0}.direita{gap:4px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="barra">
  <img src="assets/marca/p360-assinatura-horizontal-branca.png" alt="Portal 360º VR">
  <div class="direita">
    <a class="chip" href="https://www.portaldoeducador.com.br/entrar/" target="_top" aria-label="Voltar ao Portal do Educador">← <span class="rot">Portal</span></a>
    <a class="chip" href="sala/" aria-label="Sala do professor">👩‍🏫 <span class="rot">Sala do professor</span></a>
    <button type="button" class="chip som" data-action="voz" id="chipVoz" aria-pressed="false" aria-label="Voz">🔊 <span class="rot">Voz</span></button>
    <a class="chip" href="apps/tutorial/" aria-label="Primeiros passos no óculos">🎓 <span class="rot">Primeiros passos no óculos</span></a>
    <a class="chip" href="catalogo/" aria-label="Catálogo completo e guias do professor">📚 <span class="rot">Catálogo e guias</span></a>
  </div>
</header>

<main id="principal"></main>

<div class="video" id="video"><button type="button" class="fechar" data-action="fechar-video" aria-label="Fechar vídeo">✕</button><div id="videoQuadro"></div></div>

<script>
(function(){'use strict';
/* ---------- conteúdo (mesmos apps, capas e links do catálogo atual) ---------- */
var APPS=[
 {id:'sistema-solar',nome:'Sistema Solar',curto:'Sistema Solar',img:'capa-sistema-solar-card.webp',tema:'espaco',serie:['pequenos','maiores'],yt:'ZtPpHocvT7A',texto:'Os planetas, as órbitas, as fases da Lua, as estações e os eclipses. Dá para voar pelo espaço no óculos.'},
 {id:'corpo-humano',nome:'Corpo Humano',curto:'Corpo Humano',img:'capa-corpo-humano-card.webp?v=3',tema:'vida',serie:['pequenos','maiores'],yt:'TlR7TouWP5o',texto:'Oito sistemas do corpo para explorar por dentro: o coração batendo, os pulmões, o caminho da comida.'},
 {id:'celula',nome:'Célula 3D',curto:'Célula',img:'capa-celula-card.webp?v=1',tema:'vida',serie:['maiores'],texto:'A célula animal e a vegetal abertas ao meio, e uma viagem por dentro da célula.'},
 {id:'dna',nome:'DNA Imersivo',curto:'DNA',img:'capa-dna-card.webp',tema:'vida',serie:['maiores'],texto:'Entre na dupla hélice e complete a fita de DNA.'},
 {id:'terra',nome:'Terra por Dentro',curto:'Terra por Dentro',img:'capa-terra-card.webp?v=3',tema:'terra',serie:['pequenos','maiores'],texto:'A Terra aberta ao meio: camadas, vulcões, placas e rochas.'},
 {id:'historia',nome:'Egito Antigo',curto:'Egito Antigo',img:'capa-historia-card.webp?v=3',tema:'historia',serie:['pequenos','maiores'],texto:'Um museu do Egito em tamanho real, com peças de verdade escaneadas e a Grande Pirâmide por dentro.'},
 {id:'quimica',nome:'Química',curto:'Química',img:'capa-quimica-card.webp?v=1',tema:'lab',serie:['maiores'],breve:true,texto:'A tabela periódica em volta de você, um átomo para montar e o teste de chama sem risco.'},
 {id:'lab',nome:'Laboratório 3D',curto:'Laboratório',img:'capa-lab3d-card.webp?v=1',tema:'lab',serie:['maiores'],breve:true,semVR:true,explorar:'apps/lab/',texto:'Experimentos de física em 3D: dinamômetro, empuxo, pressão e vasos comunicantes.'},
 /* ---------- em breve: capa provisória até chegar a foto em assets/em-breve/<id>.webp ---------- */
 {id:'pantanal',nome:'Pantanal Vivo',img:'em-breve/pantanal.webp',tema:'vida',serie:['pequenos','maiores'],breve:true,ic:'🐊',cor:['#1f5f3a','#0b2a1a'],texto:'Uma trilha pelo maior alagado do planeta: bichos, plantas, cheia e seca.'},
 {id:'oceano',nome:'Fundo do Mar',img:'em-breve/oceano.webp',tema:'vida',serie:['pequenos','maiores'],breve:true,ic:'🐋',cor:['#0f4c7a','#06182b'],texto:'Um mergulho do recife de coral até as fossas mais profundas.'},
 {id:'dinossauros',nome:'Era dos Dinossauros',img:'em-breve/dinossauros.webp',tema:'terra',serie:['pequenos','maiores'],breve:true,ic:'🦕',cor:['#6b4a1f','#2a1a08'],texto:'Fósseis, eras geológicas e os dinossauros em tamanho real.'},
 {id:'clima',nome:'Ciclo da Água e Clima',img:'em-breve/clima.webp',tema:'terra',serie:['pequenos','maiores'],breve:true,ic:'🌦️',cor:['#2b6b8f','#0b2236'],texto:'Evaporação, nuvens, chuva e o que muda o clima do planeta.'},
 {id:'brasil-colonial',nome:'Brasil Colonial',img:'em-breve/brasil-colonial.webp',tema:'historia',serie:['pequenos','maiores'],breve:true,ic:'⛵',cor:['#7a5a2a','#2a1d0b'],texto:'As caravelas, os povos originários e a vida na vila colonial.'},
 {id:'geometria',nome:'Sólidos Geométricos',img:'em-breve/geometria.webp',tema:'mat',serie:['pequenos','maiores'],breve:true,ic:'🔷',cor:['#4a3a8f','#140f33'],texto:'Pegue, gire, abra e planifique cubos, prismas, pirâmides e esferas.'}
];
var TEMAS=[['espaco','🪐','Espaço'],['vida','❤️','Corpo e vida'],['terra','🌋','Planeta Terra'],['historia','🏛️','História'],['lab','🧪','Química e laboratório'],['mat','📐','Matemática']];
var TAGTEMA={espaco:'Espaço',vida:'Corpo e vida',terra:'Planeta Terra',historia:'História',lab:'Laboratório',mat:'Matemática'};
var CHAVE='p360_novo_inicio';
var est={ultimos:[],voz:false,filtro:'todos'};try{var sv=JSON.parse(localStorage.getItem(CHAVE)||'{}');est.ultimos=sv.ultimos||[];est.voz=!!sv.voz;}catch(e){}
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(est));}catch(e){}}
/* aparelho: no óculos o card já leva para a imersão; na lousa/computador abre o 3D direto.
   ?modo=oculos ou ?modo=tela força o modo (útil para testar e para o professor) */
var MODO=new URLSearchParams(location.search).get('modo');
/* escolha manual ("trocar") fica salva neste aparelho */
/* só a escolha "óculos" fica salva; "tela" vale só para aquele endereço, para nunca travar a detecção do óculos */
try{if(MODO==='oculos')localStorage.setItem('p360_modo','oculos');else if(MODO==='tela')localStorage.removeItem('p360_modo');else MODO=localStorage.getItem('p360_modo')==='oculos'?'oculos':null;}catch(e){}
var quest=MODO==='oculos'||(MODO!=='tela'&&(/OculusBrowser|Quest|Pacific|Pico|Vive/i.test(navigator.userAgent)||new URLSearchParams(location.search).get('quest')==='1'));
if(quest)document.body.classList.add('quest');
var $=function(id){return document.getElementById(id);};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var img=function(f){return "url('assets/"+f+"')";};

/* ---------- voz: diz o nome ao passar o dedo/raio (opcional, ajuda os pequenos) ---------- */
var tFala=null,ultimaFalada='';
/* voz gravada (assets/voz-inicio/<id>.mp3); a voz do navegador só entra se o arquivo falhar */
var vozAudio=null;
function falar(t,ja,arq){if(!est.voz)return;clearTimeout(tFala);tFala=setTimeout(function(){var k=arq||t;if(k===ultimaFalada&&!ja)return;ultimaFalada=k;
 try{if(vozAudio){vozAudio.pause();vozAudio=null;}if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}
 var tts=function(){try{if(!('speechSynthesis' in window))return;var u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=1;speechSynthesis.speak(u);}catch(e){}};
 if(!arq){tts();return;}var a=new Audio('assets/voz-inicio/'+arq+'.mp3');vozAudio=a;var caiu=false;var cair=function(){if(caiu||vozAudio!==a)return;caiu=true;tts();};a.onerror=cair;var pr=a.play();if(pr&&pr.catch)pr.catch(cair);},ja?0:180);}
function atualizarVoz(){$('chipVoz').setAttribute('aria-pressed',est.voz);$('chipVoz').innerHTML=est.voz?'🔊 <span class="rot">Voz ligada</span>':'🔈 <span class="rot">Voz</span>';}

/* ---------- vitrine: todos os apps visíveis de cara ---------- */
function destino(a){return (quest&&!a.semVR)?('apps/'+a.id+'/?vr=1'):(a.explorar||('apps/'+a.id+'/'));}
function cardApp(a,i){if(a.breve)return cardBreve(a,i);var ult=est.ultimos[0]===a.id;var vr=quest&&!a.semVR;
 var tags=(a.semVR?'<span class="tag">💻 Tela e lousa</span>':'<span class="tag vr">🥽 VR</span>')+'<span class="tag">'+esc(TAGTEMA[a.tema])+'</span>'+(a.serie.indexOf('pequenos')>=0?'<span class="tag">Anos iniciais</span>':'');
 var cta=vr?'<span class="cta vr">🥽 Entrar no óculos</span>':'<span class="cta">▶ Abrir em 3D</span>';
 return '<div class="cel" style="animation-delay:'+(i*45)+'ms"><a class="card" href="'+destino(a)+'" data-ultimo="'+a.id+'" data-fala="'+esc(a.nome)+'" data-voz="inicio-'+a.id+'">'+(a.novo?'<span class="selo">NOVO</span>':(ult?'<span class="selo cont">⏯ Continuar</span>':''))+'<span class="foto"><i style="background-image:'+img(a.img)+'"></i></span><span class="corpo"><b>'+esc(a.nome)+'</b><span class="d">'+esc(a.texto)+'</span><span class="tags">'+tags+'</span>'+cta+'</span></a>'+(a.yt?'<button type="button" class="mini" data-action="video:'+a.yt+'" data-fala="Aula em vídeo." data-voz="inicio-video" aria-label="Aula em vídeo de '+esc(a.nome)+'">▶ Vídeo</button>':'')+'</div>';}
function cardBreve(a,i){var c=a.cor||['#1d3a55','#091827'];
 return '<div class="cel" style="animation-delay:'+(i*45)+'ms"><div class="card trava" aria-disabled="true" data-fala="Esta experiência chega em breve." data-voz="inicio-em-breve" tabindex="-1"><span class="selo breve">🔒 EM BREVE</span><span class="foto"><span class="prov" style="background:radial-gradient(circle at 70% 30%,'+c[0]+','+c[1]+' 75%)"><em>'+(a.ic||'✨')+'</em></span><img class="capa" alt="" src="assets/'+a.img+'"></span><span class="corpo"><b>'+esc(a.nome)+'</b><span class="d">'+esc(a.texto)+'</span><span class="tags"><span class="tag">'+esc(TAGTEMA[a.tema])+'</span></span><span class="cta off">🔒 Em breve</span></span></div></div>';}
function render(){var f=est.filtro;
 var ord=APPS.slice().sort(function(x,y){var ix=est.ultimos.indexOf(x.id),iy=est.ultimos.indexOf(y.id);if(ix<0)ix=99;if(iy<0)iy=99;return (x.breve?1:0)-(y.breve?1:0)||ix-iy;});
 var lista=ord.filter(function(a){return f==='todos'||a.tema===f;});
 var fl='<button type="button" class="filtro" data-action="filtro:todos" aria-pressed="'+(f==='todos')+'">Todos</button>'+TEMAS.map(function(t){return '<button type="button" class="filtro" data-action="filtro:'+t[0]+'" aria-pressed="'+(f===t[0])+'">'+t[1]+' '+esc(t[2])+'</button>';}).join('');
 $('principal').innerHTML='<section class="vitrine"><div class="dica-quest">🥽 Depois de abrir, aperte o gatilho em qualquer lugar da tela para entrar na imersão.</div><div class="topo-v"><div><h1>Escolha uma <span>experiência</span></h1><p>'+(quest?'Aponte para um card e puxe o gatilho. A experiência abre pronta para a imersão.':'Toque em um card e a experiência abre em 3D na hora.')+'</p><span class="modo">'+(quest?'🥽 Modo óculos':'💻 Modo tela e lousa')+' · <a href="?modo='+(quest?'tela':'oculos')+'">'+(quest?'usar modo tela':'estou de óculos')+'</a></span></div><div class="filtros">'+fl+'</div></div><div class="grade">'+lista.map(cardApp).join('')+'</div></section>';}

var atual=null;
/* ---------- eventos (delegação; nada de onclick no HTML) ---------- */
document.addEventListener('click',function(ev){var el=ev.target.closest('[data-action]');var lk=ev.target.closest('[data-ultimo]');
 if(lk){var id=lk.getAttribute('data-ultimo');est.ultimos=[id].concat(est.ultimos.filter(function(x){return x!==id;})).slice(0,6);salvar();return;}
 if(!el)return;var a=el.getAttribute('data-action'),arg=a.split(':')[1];
 if(a.indexOf('filtro:')===0){est.filtro=arg;render();return;}
