<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sala do professor · Portal 360º VR</title>
<meta name="description" content="Painel do professor do Portal 360º VR: acompanhe cada óculos e conduza a turma.">
<link rel="icon" href="../apps/dna/assets/logo.png">
<style>
:root{--azul:#0f2c4a;--azul2:#163a5c;--verde:#1a6b2a;--verde2:#2a9a44;--ciano:#37b1da;--ciano2:#57d4ff;--fundo:#061426;--card:#0c223b;--texto:#f4f9ff;--suave:#a9bfd2;--borda:rgba(255,255,255,.12);--alerta:#ffb347;--erro:#ff7a6a}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#123a63 0%,transparent 60%),var(--fundo);color:var(--texto);font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--borda);background:rgba(15,44,74,.7);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5}
header img{width:40px;height:40px;border-radius:50%}
header .tit b{display:block;font-size:18px}header .tit span{font-size:12px;color:var(--suave);letter-spacing:.08em;text-transform:uppercase}
header .esp{flex:1}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--borda);font-weight:700;font-size:14px}
.ponto{width:10px;height:10px;border-radius:50%;background:#3ddc84;display:inline-block}.ponto.off{background:#6b7c8c}.ponto.alerta{background:var(--alerta)}
.btn{border:1px solid var(--borda);background:rgba(255,255,255,.08);color:var(--texto);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--ciano)}.btn.pri{background:var(--verde);border-color:var(--verde2)}.btn.azul{background:var(--azul2);border-color:var(--ciano)}.btn.perigo{background:#5a1f16;border-color:#a8442f}.btn.grande{padding:16px 26px;font-size:18px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
main{padding:22px;max-width:1500px;margin:0 auto}
/* abertura */
.abrir{max-width:720px;margin:8vh auto;text-align:center}
.abrir h1{font-size:clamp(28px,4vw,44px);margin:0 0 10px}.abrir p{color:var(--suave);font-size:17px;line-height:1.55}
.abrir .acoes{display:flex;gap:12px;justify-content:center;margin-top:26px;flex-wrap:wrap}
.passos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:34px;text-align:left}
.passos div{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:14px}.passos b{display:block;color:var(--ciano2);font-size:13px;letter-spacing:.06em;margin-bottom:4px}.passos span{font-size:14px;color:var(--suave)}
/* barra da sala */
.barra{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:stretch;margin-bottom:18px}
.codigo{background:linear-gradient(135deg,var(--azul2),#0b2440);border:1px solid rgba(55,177,218,.5);border-radius:18px;padding:16px 22px;text-align:center;min-width:240px}
.codigo small{display:block;color:var(--suave);font-size:12px;letter-spacing:.12em;text-transform:uppercase}.codigo b{display:block;font-size:64px;letter-spacing:.18em;line-height:1.05;color:#fff}.codigo span{font-size:12px;color:var(--suave)}
.controle{background:var(--card);border:1px solid var(--borda);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.linha{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.linha label{font-size:12px;color:var(--suave);letter-spacing:.06em;text-transform:uppercase;margin-right:2px}
select{background:#081d33;color:var(--texto);border:1px solid var(--borda);border-radius:10px;padding:9px 10px;font:600 14px system-ui;min-width:170px}
.resumo{display:flex;gap:10px;flex-wrap:wrap}
/* cards */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;position:relative}
.card.off{opacity:.55}.card.vr{border-color:rgba(61,220,132,.55);box-shadow:0 0 0 1px rgba(61,220,132,.15) inset}
.card h3{margin:0;font-size:20px;display:flex;align-items:center;gap:8px}
.card .app{font-size:13px;color:var(--ciano2);font-weight:700}
.card .missao{font-size:15px;line-height:1.35;min-height:40px}
.card .meta{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:800;letter-spacing:.06em;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--suave)}
.tag.vr{background:rgba(61,220,132,.18);color:#8ff0b8}.tag.bat{background:rgba(255,179,71,.15);color:#ffd59a}.tag.bat.baixa{background:rgba(255,122,106,.2);color:#ffb4a8}
.prog{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--verde2),var(--ciano))}
.num{display:flex;justify-content:space-between;font-size:12px;color:var(--suave)}
.card .acoes{display:flex;gap:6px;margin-top:4px}.card .acoes .btn{padding:7px 10px;font-size:12px;flex:1}
.vazio{grid-column:1/-1;text-align:center;color:var(--suave);padding:40px;border:1px dashed var(--borda);border-radius:16px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--azul2);border:1px solid var(--ciano);padding:12px 18px;border-radius:12px;font-weight:700;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none}.toast.on{opacity:1}
.aviso-cfg{max-width:640px;margin:10vh auto;background:var(--card);border:1px solid var(--alerta);border-radius:16px;padding:22px;line-height:1.55}
.aviso-cfg code{background:#081d33;padding:2px 6px;border-radius:6px}
footer{color:var(--suave);font-size:12px;text-align:center;padding:24px}
@media(max-width:820px){.barra{grid-template-columns:1fr}.passos{grid-template-columns:1fr}.codigo b{font-size:48px}header .tit span{display:none}}
</style>
</head>
<body>
<header>
 <img src="../apps/dna/assets/logo.png" alt="">
 <div class="tit"><b>Sala do professor</b><span>Portal 360º VR · Portal do Educador</span></div>
 <div class="esp"></div>
 <span class="chip" id="conexao" hidden><span class="ponto"></span><span>Conectado</span></span>
 <button class="btn" data-action="tela-cheia">⛶ Tela cheia</button>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<footer>Portal 360º VR · Portal do Educador · NEWPC Tecnologia. Os óculos só enviam o número do óculos e o andamento da atividade; nenhum dado pessoal do aluno é registrado.</footer>
<script>
(function(){'use strict';
/* endereço do banco (o mesmo do sala-cliente.js); ?saladb= sobrescreve para teste */
const DB_PADRAO='https://portal360-sala-default-rtdb.firebaseio.com';
const q=new URLSearchParams(location.search);
const LS={get:k=>{try{return localStorage.getItem(k);}catch(_){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(_){}},del:k=>{try{localStorage.removeItem(k);}catch(_){}}};
if(q.get('saladb'))LS.set('portal360_sala_db',q.get('saladb').replace(/\/+$/,''));
const DB=(LS.get('portal360_sala_db')||DB_PADRAO||'').replace(/\/+$/,'');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const APPS={corpo:'Corpo Humano Imersivo',terra:'Terra por Dentro',dna:'DNA Imersivo',solar:'Sistema Solar VR'};
let codigo=null,sala={},es=null,poll=0,offset=0,inicio=0,timer=0,refetch=0;
const SV={'.sv':'timestamp'};
async function rede(m,p,b){try{const r=await fetch(DB+'/'+p+'.json',{method:m,headers:{'Content-Type':'application/json'},body:b===undefined?undefined:JSON.stringify(b),cache:'no-store'});return r.ok?await r.json():null;}catch(_){return null;}}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600);}
const agora=()=>Date.now()+offset;

/* ---------- telas ---------- */
function telaConfig(){$('app').innerHTML='<div class="aviso-cfg"><h2>Sala ainda não configurada</h2><p>O endereço do banco de dados da Sala do professor ainda não foi definido. Depois de criar o projeto Firebase (Realtime Database), ele entra nas constantes <code>DB_PADRAO</code> deste painel e do <code>sala-cliente.js</code>.</p><p>Para teste, abra este painel com <code>?saladb=https://SEU-PROJETO.firebaseio.com</code>.</p></div>';}
function telaAbrir(){const ant=LS.get('portal360_sala_prof');
  $('app').innerHTML='<section class="abrir"><h1>Conduza a turma no VR</h1><p>Abra a sala, mostre o código na lousa e cada óculos entra digitando os 4 números. Você acompanha o que cada aluno está fazendo e leva todos para a mesma missão com um toque.</p><div class="acoes"><button class="btn pri grande" data-action="abrir">▶ Abrir nova sala</button>'+(ant?'<button class="btn azul grande" data-action="reabrir">↻ Reabrir sala '+esc(ant)+'</button>':'')+'</div><div class="passos"><div><b>1 · ABRA A SALA</b><span>Mostre o código na lousa ou na TV.</span></div><div><b>2 · NOS ÓCULOS</b><span>No catálogo, toque em "🎓 Entrar na sala", digite o código e o número do óculos.</span></div><div><b>3 · CONDUZA</b><span>Acompanhe os cards, leve todos para uma missão, pause e chame a atenção.</span></div></div></section>';}
function telaSala(){
  $('app').innerHTML='<section class="barra"><div class="codigo"><small>Código da sala</small><b id="cod">'+codigo+'</b><span>No óculos: 🎓 Entrar na sala</span></div><div class="controle">'+
   '<div class="resumo"><span class="chip"><span class="ponto"></span><span id="nOn">0 conectados</span></span><span class="chip">🥽 <span id="nVR">0 no VR</span></span><span class="chip">⏱ <span id="tempo">00:00</span></span></div>'+
   '<div class="linha"><label>Levar todos para</label><select id="selApp"></select><select id="selSec"></select><select id="selMis"></select><button class="btn pri" data-action="ir-todos">➜ Levar todos</button></div>'+
   '<div class="linha"><button class="btn azul" data-action="pausa">⏸ Pausar todos</button><button class="btn" data-action="retomar">▶ Retomar</button><button class="btn" data-action="chamar-todos">🔔 Identificar óculos</button><span class="esp" style="flex:1"></span><button class="btn perigo" data-action="encerrar">■ Encerrar aula</button></div>'+
   '</div></section><section class="grade" id="grade"></section>';
  preencherSelects();desenhar();}

/* ---------- sala: abrir, ouvir, comandar ---------- */
async function medirRelogio(){const t0=Date.now();const r=await rede('PUT','relogio/professor',SV);const t1=Date.now();if(typeof r==='number')offset=r-(t0+t1)/2;}
async function abrir(cod){
  if(!cod){for(let i=0;i<12;i++){const c=String(1000+Math.floor(Math.random()*9000));const ex=await rede('GET','salas/'+c+'/aberta');if(ex!==true){cod=c;break;}}}
  if(!cod){toast('Não consegui criar a sala. Verifique a internet.');return;}
  const ok=await rede('PATCH','salas/'+cod,{aberta:true,criada:SV});if(ok===null){toast('Sem conexão com o banco da sala.');return;}
  codigo=cod;LS.set('portal360_sala_prof',cod);inicio=Date.now();await medirRelogio();telaSala();ouvir();
  clearInterval(timer);timer=setInterval(()=>{const s=Math.floor((Date.now()-inicio)/1000);const t=$('tempo');if(t)t.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');desenhar();},1000);}
function ouvir(){parar();const busca=()=>{clearTimeout(refetch);refetch=setTimeout(async()=>{const d=await rede('GET','salas/'+codigo);if(d){sala=d;preencherSelects();desenhar();}},150);};
  try{es=new EventSource(DB+'/salas/'+codigo+'.json');es.addEventListener('put',busca);es.addEventListener('patch',busca);es.onopen=()=>conexao(true);es.onerror=()=>{conexao(false);if(es&&es.readyState===2){es=null;if(!poll)poll=setInterval(busca,2500);}};}
  catch(_){poll=setInterval(busca,2500);}busca();}
function parar(){if(es){es.close();es=null;}if(poll){clearInterval(poll);poll=0;}}
function conexao(on){const c=$('conexao');c.hidden=false;c.querySelector('.ponto').className='ponto'+(on?'':' alerta');c.lastElementChild.textContent=on?'Conectado':'Reconectando…';}
async function comando(c){c.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);c.t=SV;c.alvo=c.alvo||'todos';const r=await rede('PUT','salas/'+codigo+'/comando',c);if(r===null)toast('Comando não enviado: sem conexão.');return r;}

/* ---------- cards ---------- */
const online=o=>o&&!o.saindo&&typeof o.visto==='number'&&agora()-o.visto<20000;
function desenhar(){const g=$('grade');if(!g)return;const lista=Object.entries(sala.oculos||{}).sort((a,b)=>String(a[1].rotulo).localeCompare(String(b[1].rotulo),'pt',{numeric:true}));
  const on=lista.filter(([,o])=>online(o)),vr=on.filter(([,o])=>o.emVR);$('nOn').textContent=on.length+(on.length===1?' conectado':' conectados');$('nVR').textContent=vr.length+' no VR';
  if(!lista.length){g.innerHTML='<div class="vazio">Nenhum óculos na sala ainda. No óculos, abra o catálogo do Portal 360º, toque em <b>🎓 Entrar na sala</b> e digite <b>'+codigo+'</b>.</div>';return;}
  g.innerHTML=lista.map(([id,o])=>{const ok=online(o),pct=o.total?Math.round(100*(o.feitas||0)/o.total):0,b=o.bateria,d=o.desafio||{};
    return '<article class="card'+(ok?'':' off')+(ok&&o.emVR?' vr':'')+'"><h3><span class="ponto'+(ok?'':' off')+'"></span>'+esc(o.rotulo||'Óculos')+'</h3>'+
     '<div class="app">'+esc(o.appNome||'')+(o.secao&&o.secao!==o.appNome?' · '+esc(o.secao):'')+'</div><div class="missao">'+esc(ok?(o.viewNome||'—'):'Desconectado'+(o.visto?' há '+tempo(agora()-o.visto):''))+'</div>'+
     '<div class="meta">'+(ok&&o.emVR?'<span class="tag vr">NO VR</span>':ok?'<span class="tag">FORA DO VR</span>':'')+(b?'<span class="tag bat'+(b.nivel<=20&&!b.carregando?' baixa':'')+'">🔋 '+b.nivel+'%'+(b.carregando?' ⚡':'')+'</span>':'')+(d.respondidas?'<span class="tag">DESAFIO '+d.acertos+'/'+d.respondidas+'</span>':'')+'</div>'+
     (o.total?'<div class="prog"><i style="width:'+pct+'%"></i></div><div class="num"><span>Missões do sistema</span><span>'+(o.feitas||0)+' / '+o.total+'</span></div>':'')+
     '<div class="acoes"><button class="btn" data-action="ir-um" data-id="'+esc(id)+'">➜ Levar</button><button class="btn" data-action="chamar" data-id="'+esc(id)+'">🔔 Chamar</button><button class="btn" data-action="remover" data-id="'+esc(id)+'">✕</button></div></article>';}).join('');}
function tempo(ms){const s=Math.round(ms/1000);return s<60?s+' s':Math.round(s/60)+' min';}

/* ---------- seletores "levar para" a partir do que os óculos informaram ---------- */
function preencherSelects(){const sa=$('selApp');if(!sa)return;const mapas=sala.mapas||{};const apps=Object.keys(APPS);
  const v0=sa.value;sa.innerHTML=apps.map(a=>'<option value="'+a+'">'+esc(APPS[a])+(mapas[a]?'':' (abrir app)')+'</option>').join('');if(v0)sa.value=v0;else{const quem=Object.values(sala.oculos||{}).find(online);if(quem&&APPS[quem.app])sa.value=quem.app;}
  secoes();}
function secoes(){const sa=$('selApp'),ss=$('selSec');const m=(sala.mapas||{})[sa.value];const v0=ss.value;
  ss.innerHTML=m?m.secoes.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.nome)+'</option>').join(''):'<option value="">Início do app</option>';if(v0&&[...ss.options].some(o=>o.value===v0))ss.value=v0;ss.disabled=!m;missoes();}
function missoes(){const sa=$('selApp'),ss=$('selSec'),sm=$('selMis');const m=(sala.mapas||{})[sa.value];const s=m&&m.secoes.find(x=>x.id===ss.value);const v0=sm.value;
  sm.innerHTML=s?s.missoes.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.nome)+'</option>').join(''):'<option value="">—</option>';if(v0&&[...sm.options].some(o=>o.value===v0))sm.value=v0;sm.disabled=!s;}
function destino(){return{app:$('selApp').value,sec:$('selSec').value||'',view:$('selMis').value||''};}
function nomeDestino(d){const m=(sala.mapas||{})[d.app];const s=m&&m.secoes.find(x=>x.id===d.sec);const mi=s&&s.missoes.find(x=>x.id===d.view);return APPS[d.app]+(s?' · '+s.nome:'')+(mi?' · '+mi.nome:'');}

/* ---------- eventos (Regra 9: delegação) ---------- */
document.addEventListener('change',e=>{if(e.target.id==='selApp')secoes();else if(e.target.id==='selSec')missoes();});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const ac=b.dataset.action,id=b.dataset.id;
  if(ac==='tela-cheia'){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}catch(_){}return;}
  if(ac==='abrir'){b.disabled=true;await abrir(null);b.disabled=false;return;}
  if(ac==='reabrir'){await abrir(LS.get('portal360_sala_prof'));return;}
  if(!codigo)return;
  if(ac==='ir-todos'){const d=destino();if(await comando(Object.assign({tipo:'ir'},d))!==null)toast('Turma a caminho: '+nomeDestino(d));}
  else if(ac==='ir-um'){const d=destino();if(await comando(Object.assign({tipo:'ir',alvo:id},d))!==null)toast((sala.oculos[id]||{}).rotulo+' → '+nomeDestino(d));}
  else if(ac==='pausa'){if(await comando({tipo:'pausa'})!==null)toast('Óculos pausados: "Olhe para o professor".');}
  else if(ac==='retomar'){if(await comando({tipo:'retomar'})!==null)toast('Atividade retomada.');}
  else if(ac==='chamar'){await comando({tipo:'chamar',alvo:id});toast('Chamando '+(sala.oculos[id]||{}).rotulo+'.');}
  else if(ac==='chamar-todos'){await comando({tipo:'chamar'});toast('Cada óculos mostra o próprio número por 5 segundos.');}
  else if(ac==='remover'){await rede('DELETE','salas/'+codigo+'/oculos/'+id);toast('Óculos removido da lista.');}
  else if(ac==='encerrar'){if(!confirm('Encerrar a aula? Os óculos saem da sala e mostram "Aula encerrada".'))return;await comando({tipo:'encerrar'});setTimeout(async()=>{await rede('DELETE','salas/'+codigo);parar();clearInterval(timer);codigo=null;sala={};LS.del('portal360_sala_prof');telaAbrir();toast('Aula encerrada.');},2500);}
});
if(!DB)telaConfig();else telaAbrir();
})();
</script>
</body>
</html>
